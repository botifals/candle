name: Update OHLC JSON

on:
  schedule:
    - cron: '* * * * *' # Berjalan setiap menit
  workflow_dispatch: # Tombol manual

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Penting agar bisa update file JSON
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install WS
        run: npm install ws

      - name: Run Script
        run: node olhc.js

      - name: Commit and Push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update OHLC: $(date)" || exit 0
          git push
