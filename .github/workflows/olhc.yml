- name: Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Pastikan file masuk ke staging
          git add data.json
          
          # 2. Cek apakah ada perubahan nyata
          if ! git diff --cached --exit-code; then
            # 3. Buat commit lokal dulu
            git commit -m "Update OHLC: $(date)"
            
            # 4. Tarik perubahan terbaru dan susun ulang commit kita di atasnya (Rebase)
            # Ini akan menarik perubahan dari run sebelumnya yang mungkin sudah selesai
            git pull origin main --rebase
            
            # 5. Push ke main
            git push origin main
          else
            echo "No changes detected."
          fi
