name: Update OHLC JSON

on:
  schedule:
    - cron: '* * * * *' # Setiap menit
  workflow_dispatch:

concurrency:
  group: update-ohlc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install WS
        run: npm install ws

      - name: Run Script
        run: node olhc.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data.json
          
          # Hanya commit jika ada perubahan data
          if ! git diff --cached --exit-code > /dev/null 2>&1; then
            git commit -m "Update OHLC: $(date)"
            
            # Fetch latest changes dan rebase
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase conflict, akan coba lagi di run berikutnya"
              exit 0
            fi
            
            # Push dengan force-with-lease untuk handle race condition
            git push origin main --force-with-lease || echo "Push failed, another run might have pushed first"
          else
            echo "No changes detected."
          fi
